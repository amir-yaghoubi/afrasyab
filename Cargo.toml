[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/domain",
    "crates/storage",
    "crates/downloader",
    "crates/drive",
    "crates/oauth",
    "crates/telegram",
    "crates/app",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
regex = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json", "migrate"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
async-trait = "0.1"
teloxide = { version = "0.13", default-features = false, features = ["rustls", "macros", "webhooks-axum", "ctrlc_handler"] }
mockito = "1.6"
futures-util = "0.3"
oauth2 = { version = "4", default-features = false, features = ["reqwest"] }
axum = { version = "0.7", features = ["macros"] }
dotenvy = "0.15"
