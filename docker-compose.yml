services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

  app:
    image: ghcr.io/amir-yaghoubi/afrasyab:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
      - /tmp:/tmp
    env_file: .env
    environment:
      DATABASE_URL: sqlite:/data/afrasyab.db?mode=rwc
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SUPER_ADMIN_TELEGRAM_ID: ${SUPER_ADMIN_TELEGRAM_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      HTTP_BIND: ${HTTP_BIND:-0.0.0.0:8080}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      RUST_LOG: ${RUST_LOG:-info}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-25}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
    labels:
      - traefik.enable=true
      - traefik.http.routers.afrasyab.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.afrasyab.entrypoints=websecure
      - traefik.http.routers.afrasyab.tls.certresolver=le
      - traefik.http.services.afrasyab.loadbalancer.server.port=8080

volumes:
  traefik-acme:
